[package]
name = "tinymemes-remix-marker-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
tinymemes-bus = { path = "../../../crates/tinymemes-bus" }
tinymemes-client = { path = "../../../crates/tinymemes-client", features = ["host-callback"] }
tinybus = { git = "https://github.com/tinyhumansai/tinybus", rev = "d5b949be8ea56eb5a17289a09aa28e8c09bd88b7", default-features = false, features = ["modules"] }
tinystoragedrivers-api = { git = "https://github.com/senamakel/tinystoragedrivers", tag = "v2.0.1" }
tinystoragedrivers-busproxy = { git = "https://github.com/senamakel/tinystoragedrivers", tag = "v2.0.1" }
tinystoragedrivers-testkit = { git = "https://github.com/senamakel/tinystoragedrivers", tag = "v2.0.1" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tempfile = "3"
async-trait = "0.1"
