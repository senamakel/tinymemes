[package]
name = "tinymemes-remix-marker-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
tinymemes-bus = { path = "../../../crates/tinymemes-bus" }
tinymemes-client = { path = "../../../crates/tinymemes-client", features = ["host-callback"] }
tinybus = { version = ">=0.3.3, <0.4.0", git = "https://github.com/tinyhumansai/tinybus", rev = "207a9a7df15e44fdba00a807d0f7eaf21904ba0e", default-features = false, features = ["modules"] }
tinystoragedrivers-bus = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v1.6.0" }
tinystoragedrivers-core = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v1.6.0" }
tinystoragedrivers-tinybus = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v1.6.0" }
tinystoragedrivers-sqlite = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v1.6.0" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tempfile = "3"
async-trait = "0.1"
