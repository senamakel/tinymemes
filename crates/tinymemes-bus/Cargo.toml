[package]
name = "tinymemes-bus"
version = "0.4.4"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Content-only TinyMemes contract: wire types, member names and versions. Synchronous and I/O-free."
repository = "https://github.com/tinyhumansai/tinymemes"

[features]
default = []
# `storage::storage_schema()`: the memes.state collection and its v1->v2 step.
# Ports-only storage core (no I/O, no runtime); a host composing schemas enables it.
storage = ["dep:tinystoragedrivers-core"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinystoragedrivers-core = { version = "1.9.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "a04e3a174fa8f28d5229a816ca6b39c72a9efd7b", default-features = false, optional = true }

[dev-dependencies]
tinystoragedrivers-core = { version = "1.9.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "a04e3a174fa8f28d5229a816ca6b39c72a9efd7b", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
