[package]
name = "tinymemes-bus"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Content-only TinyMemes contract: wire types, member names and versions. Synchronous and I/O-free."
repository = "https://github.com/tinyhumansai/tinymemes"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ports only (no I/O, no runtime): the schema types `storage_schema()` returns.
tinystoragedrivers-core = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v1.0.0", default-features = false }

[dev-dependencies]
tinystoragedrivers-core = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v1.0.0", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
