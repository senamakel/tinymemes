[package]
name = "tinymemes-module"
version = "0.4.2"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Stateless TinyMemes content operations over the TinyBus module ABI."
repository = "https://github.com/tinyhumansai/tinymemes"

[features]
default = []
# Link the module into a host binary without exporting the shared C names; the
# host admits it in-process with `linked_module()`.
static-link = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tinystoragedrivers-bus = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v1.6.0", default-features = false, features = ["client"] }
tinymemes = { path = "../.." }
tinymemes-bus = { path = "../tinymemes-bus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }
tinybus = { version = ">=0.3.3, <0.4.0", git = "https://github.com/tinyhumansai/tinybus", rev = "207a9a7df15e44fdba00a807d0f7eaf21904ba0e", default-features = false }
tinybus-module = { version = ">=0.3.3, <0.4.0", git = "https://github.com/tinyhumansai/tinybus", rev = "207a9a7df15e44fdba00a807d0f7eaf21904ba0e" }

[dev-dependencies]
tinymemes-client = { path = "../tinymemes-client", features = ["host-callback"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tinybus = { version = ">=0.3.3, <0.4.0", git = "https://github.com/tinyhumansai/tinybus", rev = "207a9a7df15e44fdba00a807d0f7eaf21904ba0e", default-features = false, features = ["modules"] }
tinystoragedrivers-bus = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v1.6.0" }
tinystoragedrivers-core = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v1.6.0" }
tinystoragedrivers-tinybus = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v1.6.0" }
tinystoragedrivers-sqlite = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v1.6.0" }
tempfile = "3"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

[[test]]
name = "static_link"
path = "tests/static_link.rs"
required-features = ["static-link"]

[[test]]
name = "remix_markers"
path = "tests/remix_markers.rs"
