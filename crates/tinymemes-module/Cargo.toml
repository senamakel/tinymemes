[package]
name = "tinymemes-module"
version = "0.4.4"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Stateless TinyMemes content operations over the TinyBus module ABI."
repository = "https://github.com/tinyhumansai/tinymemes"

[features]
default = []
# Link the module into a host binary without exporting the shared C names; the
# host admits it in-process with `linked_module()`.
static-link = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tinystoragedrivers-bus = { version = "1.9.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "a04e3a174fa8f28d5229a816ca6b39c72a9efd7b", default-features = false, features = ["client"] }
tinymemes = { path = "../.." }
tinymemes-bus = { path = "../tinymemes-bus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }
tinybus = { version = "=0.3.11", git = "https://github.com/tinyhumansai/tinybus", rev = "9e14f65666b11782ec1054aba576114026d180f8", default-features = false }
tinybus-module = { version = "=0.3.11", git = "https://github.com/tinyhumansai/tinybus", rev = "9e14f65666b11782ec1054aba576114026d180f8" }

[dev-dependencies]
tinymemes-client = { path = "../tinymemes-client", features = ["host-callback"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tinybus = { version = "=0.3.11", git = "https://github.com/tinyhumansai/tinybus", rev = "9e14f65666b11782ec1054aba576114026d180f8", default-features = false, features = ["modules"] }
tinystoragedrivers-bus = { version = "1.9.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "a04e3a174fa8f28d5229a816ca6b39c72a9efd7b" }
tinystoragedrivers-core = { version = "1.9.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "a04e3a174fa8f28d5229a816ca6b39c72a9efd7b" }
tinystoragedrivers-tinybus = { version = "1.9.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "a04e3a174fa8f28d5229a816ca6b39c72a9efd7b" }
tinystoragedrivers-sqlite = { version = "1.9.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "a04e3a174fa8f28d5229a816ca6b39c72a9efd7b" }
tempfile = "3"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

[[test]]
name = "static_link"
path = "tests/static_link.rs"
required-features = ["static-link"]

[[test]]
name = "remix_markers"
path = "tests/remix_markers.rs"
