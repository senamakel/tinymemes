[package]
name = "tinymemes-module"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Stateless TinyMemes content operations over the TinyBus module ABI."
repository = "https://github.com/tinyhumansai/tinymemes"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tinystoragedrivers-bus = { git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "7c5596f37e5d5440fbfa3a049a3ca98571885584" }
tinymemes = { path = "../..", version = "0.1.0" }
tinymemes-bus = { path = "../tinymemes-bus", version = "0.1.0" }
serde_json = "1"
async-trait = "0.1"
tinybus = { git = "https://github.com/tinyhumansai/tinybus", rev = "1f2557657db97470cd4efb7e1fc2f374f36fdd22", default-features = false }
tinybus-module = { git = "https://github.com/tinyhumansai/tinybus", rev = "1f2557657db97470cd4efb7e1fc2f374f36fdd22" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tinybus = { git = "https://github.com/tinyhumansai/tinybus", rev = "1f2557657db97470cd4efb7e1fc2f374f36fdd22", default-features = false, features = ["modules"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
