[package]
name = "tinymemes-client"
version = "0.4.2"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Typed TinyBus clients for the TinyMemes module, without linking its implementation."
repository = "https://github.com/tinyhumansai/tinymemes"

[features]
default = []
host-callback = ["tinybus/modules"]

[dependencies]
tinymemes-bus = { version = "0.4.2", path = "../tinymemes-bus" }
tinybus = { version = "=0.3.11", git = "https://github.com/tinyhumansai/tinybus", rev = "9e14f65666b11782ec1054aba576114026d180f8", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tinybus = { version = "=0.3.11", git = "https://github.com/tinyhumansai/tinybus", rev = "9e14f65666b11782ec1054aba576114026d180f8", default-features = false, features = ["modules"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
