[workspace]
exclude = ["proof-workspaces/remix-markers"]
members = [".", "crates/tinymemes-bus", "crates/tinymemes-module"]
resolver = "2"

[package]
name = "tinymemes"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
# Never published to crates.io: hosts (OpenHuman, Chottu) vendor it by path.
# Saying so lets their supply-chain checks treat its path and git dependencies
# as first-party instead of as wildcard registry requirements.
publish = false
description = "Reads a chat with Jev, rates how much fun a reply can take, and remixes it with slang and memes."
repository = "https://github.com/tinyhumansai/tinymemes"
readme = "README.md"
keywords = ["memes", "llm", "openhuman", "jev", "chat"]
categories = ["text-processing"]

[dependencies]
tinymemes-bus = { path = "crates/tinymemes-bus", version = "0.1.0" }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
# Jev decision model client. OpenHuman redirects this to its vendored copy via
# `[patch."https://github.com/tinyhumansai/tinyinference"]`, so the host and
# this module share one `tinyinference-decisions` package.
tinyinference-decisions = { git = "https://github.com/tinyhumansai/tinyinference", rev = "abf90568a24b826d49900150b20856ef166df3f8" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

# Temporary dependency-DRAFT shim for TinyBus PR60. Cargo’s replacement
# selector is source/name/version (not revision); every original declaration
# is pinned to canonical 1f255765. Remove after PR60/27 merge and refresh pins.
[replace]
"https://github.com/tinyhumansai/tinybus#tinybus:0.1.4" = { git = "https://github.com/tinyhumansai/tinybus", rev = "5256d08c41df5852ac1ccfcb58d4b24282b53cd7" }
"https://github.com/tinyhumansai/tinybus#tinybus-module:0.1.4" = { git = "https://github.com/tinyhumansai/tinybus", rev = "5256d08c41df5852ac1ccfcb58d4b24282b53cd7" }
